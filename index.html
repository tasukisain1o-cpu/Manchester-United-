<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#0a0a0a" />
<title>Manchester United — Digital Locker Room</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
<style>
:root{--mu-red:#da291c;--mu-red-dark:#8b1a10;--bg-0:#050505;--border-0:rgba(255,255,255,.06);--border-1:rgba(255,255,255,.12);--border-red:rgba(218,41,28,.5);--text-0:#fff;--text-1:rgba(255,255,255,.7);--text-2:rgba(255,255,255,.45);--text-3:rgba(255,255,255,.25);--font-display:'Bebas Neue','Arial Narrow',sans-serif;--font-body:'Inter',system-ui,-apple-system,sans-serif;--ease-out:cubic-bezier(.22,1,.36,1)}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body,#root{width:100%;min-height:100%;background:var(--bg-0);color:var(--text-0);font-family:var(--font-body);-webkit-font-smoothing:antialiased;overflow-x:hidden;overscroll-behavior:none}
body{min-height:100vh;min-height:100dvh}
button{font-family:inherit;color:inherit;background:none;border:none;cursor:pointer}
::-webkit-scrollbar{height:4px;width:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.15);border-radius:2px}
.grain::before{content:'';position:fixed;inset:-50%;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.4'/%3E%3C/svg%3E");opacity:.045;pointer-events:none;z-index:9999;animation:grainShift 8s steps(10) infinite}
@keyframes grainShift{0%,100%{transform:translate(0,0)}10%{transform:translate(-5%,-5%)}30%{transform:translate(3%,-3%)}50%{transform:translate(-2%,4%)}70%{transform:translate(4%,2%)}90%{transform:translate(-3%,-2%)}}
.display{font-family:var(--font-display);letter-spacing:.02em;line-height:.9}
.mono-label{font-family:var(--font-body);font-size:10px;font-weight:500;letter-spacing:.28em;text-transform:uppercase;color:var(--text-2)}
.hair{height:1px;width:100%;background:linear-gradient(90deg,transparent,var(--border-1),transparent)}
.app{position:relative;min-height:100vh;background:var(--bg-0);overflow-x:hidden}
.intro{position:fixed;inset:0;z-index:9998;background:#000;display:grid;place-items:center;overflow:hidden}
.intro-vignette{position:absolute;inset:0;background:radial-gradient(ellipse at center,rgba(218,41,28,.14),transparent 60%);pointer-events:none}
.intro-content{position:relative;text-align:center;padding:0 24px}
.intro-title{font-family:var(--font-display);font-size:clamp(38px,8vw,96px);letter-spacing:.06em;color:#fff;text-shadow:0 0 80px rgba(218,41,28,.5)}
.nav{position:fixed;top:0;left:0;right:0;z-index:100;display:flex;align-items:center;justify-content:space-between;padding:16px 28px;background:linear-gradient(180deg,rgba(5,5,5,.92),rgba(5,5,5,.4) 70%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--border-0)}
.nav-left{display:flex;align-items:center;gap:14px}
.crest{width:40px;height:40px;display:grid;place-items:center;border-radius:6px;background:linear-gradient(135deg,var(--mu-red),var(--mu-red-dark));box-shadow:0 0 24px rgba(218,41,28,.45),inset 0 0 0 1px rgba(255,255,255,.08)}
.crest-inner{font-family:var(--font-display);font-size:20px;color:#fff;letter-spacing:.04em}
.nav-club-name{font-size:16px;letter-spacing:.14em}
.nav-center{display:flex;gap:32px}
.nav-link{position:relative;padding:8px 2px;color:var(--text-2);transition:color .25s var(--ease-out)}
.nav-link:hover{color:var(--text-0)}
.nav-link.active{color:#fff}
.nav-underline{position:absolute;left:0;right:0;bottom:-2px;height:1px;background:var(--mu-red);box-shadow:0 0 12px var(--mu-red)}
.nav-right{display:flex;align-items:center;gap:16px}
.sound-btn{color:var(--text-2);padding:8px 14px;border:1px solid var(--border-1);border-radius:999px;transition:all .25s var(--ease-out)}
.sound-btn:hover{color:#fff;border-color:var(--border-red)}
.burger{width:40px;height:40px;display:grid;place-items:center}
.burger-line{display:block;width:20px;height:1px;background:#fff;position:relative}
.burger-line::before,.burger-line::after{content:'';position:absolute;left:0;width:20px;height:1px;background:#fff;transition:transform .3s var(--ease-out)}
.burger-line::before{top:-6px}.burger-line::after{top:6px}
.mobile-menu{position:fixed;top:73px;left:0;right:0;z-index:99;background:rgba(10,10,10,.96);backdrop-filter:blur(20px);padding:24px;display:flex;flex-direction:column;gap:8px;border-bottom:1px solid var(--border-1)}
.mobile-nav-link{font-size:28px;letter-spacing:.05em;color:var(--text-2);padding:12px 4px;text-align:left;border-bottom:1px solid var(--border-0)}
.mobile-nav-link.active{color:var(--mu-red)}
.desktop-only{display:flex}.mobile-only{display:none}
.season-bar{position:relative;display:flex;align-items:center;gap:20px;padding:12px 28px;border-top:1px solid var(--border-0);border-bottom:1px solid var(--border-0);background:linear-gradient(180deg,rgba(0,0,0,.35),rgba(0,0,0,.15));backdrop-filter:blur(6px)}
.season-label{flex-shrink:0;color:var(--text-2)}
.season-track{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;scroll-snap-type:x proximity}
.season-track::-webkit-scrollbar{display:none}
.season-chip{flex-shrink:0;padding:8px 16px;font-size:15px;letter-spacing:.08em;color:var(--text-2);border:1px solid transparent;border-radius:999px;transition:all .3s var(--ease-out);scroll-snap-align:center}
.season-chip:hover{color:var(--text-0);border-color:var(--border-1)}
.season-chip.active{color:#fff;background:linear-gradient(180deg,rgba(218,41,28,.18),rgba(218,41,28,.05));border-color:var(--mu-red);box-shadow:0 0 20px rgba(218,41,28,.3),inset 0 0 12px rgba(218,41,28,.15)}
.filter{display:flex;align-items:center;gap:16px;padding:10px 28px;border-bottom:1px solid var(--border-0);background:rgba(0,0,0,.25);backdrop-filter:blur(6px)}
.filter-label{color:var(--text-2);flex-shrink:0}
.filter-track{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.filter-track::-webkit-scrollbar{display:none}
.filter-chip{flex-shrink:0;padding:6px 14px;font-family:var(--font-body);font-size:11px;font-weight:600;letter-spacing:.2em;color:var(--text-2);border:1px solid transparent;border-radius:4px;transition:all .25s var(--ease-out)}
.filter-chip:hover{color:var(--text-0)}
.filter-chip.active{color:#fff;background:rgba(255,255,255,.04);border-color:var(--border-1)}
.filter-chip.active::before{content:'';display:inline-block;width:5px;height:5px;background:var(--mu-red);border-radius:999px;margin-right:8px;box-shadow:0 0 8px var(--mu-red);vertical-align:middle}
.locker{position:relative;min-height:100vh;min-height:100dvh;padding-top:76px;overflow-x:hidden}
.locker-bg{position:fixed;inset:-40px;z-index:0;transition:transform .6s var(--ease-out);will-change:transform;pointer-events:none}
.locker-bg-lights{position:absolute;inset:0;background:radial-gradient(60% 40% at 20% 0%,rgba(218,41,28,.22),transparent 60%),radial-gradient(50% 40% at 85% 10%,rgba(255,255,255,.06),transparent 60%),radial-gradient(70% 60% at 50% 110%,rgba(218,41,28,.12),transparent 60%),linear-gradient(180deg,#0a0a0a 0%,#050505 60%,#000 100%)}
.locker-bg-panels{position:absolute;inset:0;background-image:linear-gradient(180deg,rgba(255,255,255,.025),transparent 40%),repeating-linear-gradient(90deg,rgba(255,255,255,.028) 0 1px,transparent 1px 120px),repeating-linear-gradient(0deg,rgba(0,0,0,.4) 0 1px,transparent 1px 80px);opacity:.75;mask-image:radial-gradient(ellipse at center,#000 40%,transparent 90%);-webkit-mask-image:radial-gradient(ellipse at center,#000 40%,transparent 90%)}
.locker-bg-dust{position:absolute;inset:0;background-image:radial-gradient(1px 1px at 20% 30%,rgba(255,255,255,.25),transparent 60%),radial-gradient(1px 1px at 70% 60%,rgba(255,255,255,.18),transparent 60%),radial-gradient(1px 1px at 40% 80%,rgba(255,255,255,.16),transparent 60%),radial-gradient(1px 1px at 85% 25%,rgba(255,255,255,.14),transparent 60%);opacity:.35;animation:dustDrift 30s linear infinite}
@keyframes dustDrift{from{background-position:0 0,0 0,0 0,0 0}to{background-position:40px -60px,-30px 40px,20px 80px,-50px -20px}}
.locker-head{position:relative;z-index:2;display:flex;align-items:flex-end;justify-content:space-between;padding:36px 40px 18px;gap:24px}
.locker-title{font-size:clamp(36px,6vw,72px);letter-spacing:.02em;color:#fff;margin:6px 0 8px;text-shadow:0 4px 40px rgba(0,0,0,.8)}
.locker-head-sub{color:var(--text-2)}
.locker-head-right{color:var(--text-2);display:flex;align-items:center;gap:8px}
.live-dot{width:6px;height:6px;border-radius:999px;background:var(--mu-red);box-shadow:0 0 12px var(--mu-red);animation:pulse 2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.locker-rail-wrap{position:relative;z-index:2;margin-top:44px;padding-bottom:120px}
.rail-metal{position:absolute;left:0;right:0;top:22px;height:6px;z-index:1}
.rail-line{position:absolute;left:0;right:0;top:0;height:3px;background:linear-gradient(180deg,#cfcfd4,#5a5a60 60%,#2c2c30);box-shadow:0 2px 10px rgba(0,0,0,.7),inset 0 1px 0 rgba(255,255,255,.5)}
.rail-line-back{position:absolute;left:0;right:0;top:8px;height:2px;background:linear-gradient(180deg,rgba(255,255,255,.15),transparent)}
.rail-track{position:relative;z-index:2;display:flex;gap:8px;padding:0 40px;overflow-x:auto;overflow-y:visible;scrollbar-width:none;-webkit-overflow-scrolling:touch;scroll-padding:40px}
.rail-track::-webkit-scrollbar{display:none}
.locker-foot{position:relative;z-index:2;display:flex;align-items:center;gap:14px;padding:22px 40px 40px;color:var(--text-3);border-top:1px solid var(--border-0);margin-top:20px}
.locker-foot-sep{width:4px;height:4px;border-radius:999px;background:var(--mu-red);opacity:.6}
.shirt-wrap{position:relative;flex-shrink:0;width:168px;padding:16px 8px 0;cursor:pointer;perspective:1000px;will-change:transform,opacity}
.shirt-stage{position:relative;width:100%;height:240px;display:flex;flex-direction:column;align-items:center;transform-style:preserve-3d}
.hangar{position:relative;width:100%;height:46px;display:flex;flex-direction:column;align-items:center;z-index:3;pointer-events:none}
.hangar-hook{width:22px;height:22px;border:2px solid rgba(200,200,205,.8);border-radius:50%;border-bottom-color:transparent;transform:rotate(-10deg);box-shadow:inset 0 0 6px rgba(255,255,255,.15)}
.hangar-bar{width:90px;height:3px;background:linear-gradient(180deg,#d7d7db,#6c6c72);border-radius:2px;margin-top:-8px;box-shadow:0 2px 6px rgba(0,0,0,.6)}
.hangar-neck{width:3px;height:14px;background:linear-gradient(180deg,#b5b5b8,#55555a)}
.shirt{position:relative;width:130px;height:160px;margin-top:-4px;border-radius:8px 8px 6px 6px;background:radial-gradient(120% 80% at 50% 0%,rgba(255,255,255,.08),transparent 60%),linear-gradient(180deg,var(--mu-red),#9a1a11 85%,#6f120b);box-shadow:inset 0 -12px 24px rgba(0,0,0,.45),inset 0 2px 0 rgba(255,255,255,.1),0 12px 28px rgba(0,0,0,.6);overflow:hidden;transition:filter .4s var(--ease-out),transform .4s var(--ease-out)}
.shirt.away{background:radial-gradient(120% 80% at 50% 0%,rgba(255,255,255,.15),transparent 60%),linear-gradient(180deg,#f7f7f7,#d8d8d8 85%,#b5b5b5);color:#111}
.shirt.away .shirt-num,.shirt.away .shirt-name{color:#111;text-shadow:0 1px 0 rgba(255,255,255,.6)}
.shirt-collar{position:absolute;top:7px;left:50%;transform:translateX(-50%);width:38px;height:18px;border:2px solid rgba(255,255,255,.72);border-top:0;border-radius:0 0 18px 18px;z-index:3;opacity:.85}.shirt-crest{position:absolute;top:27px;left:13px;width:25px;height:25px;border:1px solid rgba(255,255,255,.65);border-radius:50%;display:grid;place-items:center;font:700 8px/1 Arial,sans-serif;letter-spacing:-.04em;color:#fff;background:rgba(0,0,0,.18);z-index:4;box-shadow:0 2px 8px rgba(0,0,0,.25)}.shirt-sponsor{position:absolute;top:57px;left:50%;transform:translateX(-50%);font:800 7px/1 Arial,sans-serif;letter-spacing:.16em;color:rgba(255,255,255,.72);z-index:3}.shirt.away .shirt-collar{border-color:rgba(0,0,0,.48)}.shirt.away .shirt-crest{color:#111;border-color:rgba(0,0,0,.35)}.shirt.away .shirt-sponsor{color:rgba(0,0,0,.48)}
.shirt::before{content:'';position:absolute;inset:0;background-image:repeating-linear-gradient(45deg,rgba(0,0,0,.06) 0 1px,transparent 1px 3px),repeating-linear-gradient(-45deg,rgba(255,255,255,.04) 0 1px,transparent 1px 4px);pointer-events:none;mix-blend-mode:overlay;opacity:.6}
.shirt::after{content:'';position:absolute;top:0;left:0;right:0;height:60%;background:linear-gradient(180deg,rgba(255,255,255,.14),transparent 70%);pointer-events:none}
.shirt.selected{filter:brightness(1.12) saturate(1.06);box-shadow:inset 0 -12px 24px rgba(0,0,0,.5),0 24px 48px rgba(218,41,28,.35),0 0 60px rgba(218,41,28,.35)}
.shirt-body{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding-top:22px;z-index:2}
.shirt-num{font-size:54px;color:#fff;line-height:.85;text-shadow:0 2px 6px rgba(0,0,0,.5);letter-spacing:.02em}
.shirt-name{font-size:17px;letter-spacing:.14em;color:#fff;margin-top:4px;text-shadow:0 2px 6px rgba(0,0,0,.5);max-width:116px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.shirt-shoulder{position:absolute;top:-2px;left:-14px;right:-14px;height:30px;background:linear-gradient(180deg,#b71f13,#8b1a10);border-radius:50% 50% 12px 12px / 60% 60% 20% 20%;z-index:1}
.shirt-sleeve{position:absolute;top:12px;width:26px;height:70px;background:linear-gradient(180deg,#a81d12,#741008);border-radius:8px;z-index:0;box-shadow:inset 0 -8px 16px rgba(0,0,0,.4)}
.shirt-sleeve.left{left:-22px;transform:rotate(6deg)}
.shirt-sleeve.right{right:-22px;transform:rotate(-6deg)}
.shirt-shadow{position:absolute;bottom:-2px;left:50%;transform:translateX(-50%);width:130px;height:12px;background:radial-gradient(closest-side,rgba(0,0,0,.65),transparent);filter:blur(4px);transition:all .4s var(--ease-out);z-index:-1}
.shirt-shadow.strong{bottom:-22px;width:170px;height:20px;background:radial-gradient(closest-side,rgba(218,41,28,.5),transparent);filter:blur(8px)}
.shirt-glow{position:absolute;inset:-20px;background:radial-gradient(closest-side,rgba(218,41,28,.4),transparent 70%);opacity:0;transition:opacity .4s var(--ease-out);pointer-events:none;z-index:-1}
.shirt-glow.on{opacity:1}
.shirt-tag{text-align:center;margin-top:14px;color:var(--text-3)}
.pcard{position:fixed;top:96px;right:24px;bottom:24px;width:380px;z-index:90;overflow:hidden}
.pcard-inner{height:100%;overflow-y:auto;padding:24px 22px 20px;border-radius:14px;background:linear-gradient(180deg,rgba(20,20,20,.78),rgba(10,10,10,.85));border:1px solid var(--border-1);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);box-shadow:0 30px 80px rgba(0,0,0,.7),inset 0 1px 0 rgba(255,255,255,.06);position:relative}
.pcard-inner::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,var(--mu-red),transparent);opacity:.7}
.pcard-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.pcard-close{width:28px;height:28px;display:grid;place-items:center;border:1px solid var(--border-1);border-radius:6px;color:var(--text-2);transition:all .25s var(--ease-out)}
.pcard-close:hover{color:#fff;border-color:var(--border-red)}
.pcard-season{color:var(--text-2);margin-bottom:18px}
.pcard-hero{display:flex;align-items:flex-end;gap:16px;margin-bottom:22px}.pcard-hero-copy{min-width:0}.pcard-portrait{position:relative;width:112px;height:136px;flex:0 0 112px;border-radius:12px;overflow:hidden;background:linear-gradient(180deg,#191919,#090909);border:1px solid var(--border-1);box-shadow:0 18px 40px rgba(0,0,0,.45)}.pcard-portrait img{width:100%;height:100%;object-fit:cover;object-position:center top;display:block;filter:saturate(.9) contrast(1.03)}.pcard-portrait-fallback{width:100%;height:100%;display:grid;place-items:center;color:#fff;font-size:34px}.pcard-portrait-glow{position:absolute;inset:0;background:linear-gradient(180deg,transparent 45%,rgba(218,41,28,.28));pointer-events:none}.pcard-num{font-size:56px;line-height:.8;color:var(--mu-red);text-shadow:0 0 28px rgba(218,41,28,.28)}
.pcard-num{font-size:96px;line-height:.82;color:var(--mu-red);text-shadow:0 0 40px rgba(218,41,28,.5);letter-spacing:-.02em}
.pcard-pos{color:var(--mu-red);margin-bottom:4px}
.pcard-name{font-size:34px;letter-spacing:.04em;color:#fff;line-height:.95}
.pcard-fullname{font-size:12px;color:var(--text-2);margin-top:4px;letter-spacing:.04em}
.pcard-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px 12px;margin:18px 0}
.pcard-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:18px 0}
.pcard-trophies{margin:16px 0 12px}
.pcard-trophies-list{margin-top:6px;font-size:13px;color:var(--text-1);line-height:1.5}
.pcard-nav{display:flex;gap:8px;margin-top:18px;padding-top:14px;border-top:1px solid var(--border-0)}
.pcard-nav-btn{flex:1;padding:10px;border:1px solid var(--border-1);border-radius:8px;color:var(--text-1);transition:all .25s var(--ease-out)}
.pcard-nav-btn:hover:not(:disabled){color:#fff;border-color:var(--border-red);background:rgba(218,41,28,.08)}
.pcard-nav-btn:disabled{opacity:.25;cursor:default}
.pcard-row-label{margin-bottom:4px}
.pcard-row-value{font-size:13px;color:var(--text-0)}
.pcard-stat{padding:12px 8px;border:1px solid var(--border-0);border-radius:8px;text-align:center;background:rgba(255,255,255,.02)}
.pcard-stat .display{font-size:26px;color:#fff}
/* ============ КАРТОЧКА ИГРОКА / 3D CARD ============ */
.pcard{perspective:1400px}
.pcard-inner{overflow:hidden}
.pcard-inner::after{content:'';position:absolute;inset:0;background:radial-gradient(circle at 85% 10%,rgba(218,41,28,.14),transparent 28%),linear-gradient(135deg,transparent 55%,rgba(255,255,255,.025));pointer-events:none}
.pcard-reveal{position:relative;z-index:2;min-height:100%;perspective:1400px}
.pcard-flip{position:relative;width:100%;min-height:430px;transform-style:preserve-3d;transition:transform .8s cubic-bezier(.22,1,.36,1)}
.pcard-flip.is-flipped{transform:rotateY(180deg)}
.pcard-face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:12px;overflow:hidden;border:1px solid rgba(255,255,255,.08);background:linear-gradient(160deg,rgba(28,28,28,.9),rgba(7,7,7,.96));box-shadow:0 24px 70px rgba(0,0,0,.55)}
.pcard-face.back{transform:rotateY(180deg);padding:22px;background:radial-gradient(circle at 50% 20%,rgba(218,41,28,.22),transparent 42%),linear-gradient(145deg,#171717,#050505)}
.pcard-front-bg{position:absolute;inset:0;background:linear-gradient(180deg,transparent 25%,rgba(0,0,0,.15) 42%,rgba(0,0,0,.92) 100%);z-index:2}
.pcard-front-photo{position:absolute;inset:0;background-size:cover;background-position:center top;filter:saturate(.9) contrast(1.06);transform:scale(1.02)}
.pcard-front-photo.empty{background:radial-gradient(circle at 50% 30%,rgba(218,41,28,.35),transparent 38%),#111}
.pcard-front-copy{position:absolute;left:20px;right:20px;bottom:20px;z-index:3}
.pcard-front-copy .pcard-num{font-size:94px;line-height:.7;color:#fff;text-shadow:0 8px 30px #000}
.pcard-front-copy .pcard-name{font-size:38px;text-shadow:0 4px 20px #000}
.pcard-front-meta{display:flex;align-items:center;justify-content:space-between;margin-top:10px;gap:10px}
.pcard-flip-hint{display:inline-flex;align-items:center;gap:7px;padding:7px 10px;border:1px solid rgba(255,255,255,.18);border-radius:999px;background:rgba(0,0,0,.4);font-size:9px;letter-spacing:.18em;color:rgba(255,255,255,.75)}
.pcard-flip-hint::before{content:'↻';font-size:13px;color:var(--mu-red)}
.pcard-back-number{font-size:150px;line-height:.65;color:rgba(218,41,28,.18);position:absolute;right:-6px;top:58px}

function useParallax(s=12){const[p,setP]=useState({x:0,y:0});useEffect(()=>{const on=(e)=>{const x=(e.clientX/window.innerWidth-.5)*s;const y=(e.clientY/window.innerHeight-.5)*s;setP({x,y});};window.addEventListener('mousemove',on,{passive:true});return()=>window.removeEventListener('mousemove',on);},[s]);return p;}
let _ac=null;function getAC(){if(!_ac){const C=window.AudioContext||window.webkitAudioContext;_ac=new C();}return _ac;}
function playTone(f,d=.06,t='sine',g=.04){try{const c=getAC();const o=c.createOscillator();const gn=c.createGain();o.type=t;o.frequency.value=f;gn.gain.value=g;o.connect(gn);gn.connect(c.destination);const now=c.currentTime;gn.gain.setValueAtTime(g,now);gn.gain.exponentialRampToValueAtTime(.0001,now+d);o.start(now);o.stop(now+d);}catch(e){}}
function useSound(){const[e,setE]=useState(false);return{enabled:e,toggle:()=>setE(v=>!v),hover:()=>{if(e)playTone(880,.03,'sine',.02);},click:()=>{if(e)playTone(220,.08,'triangle',.05);}};}

return(<AnimatePresence>{!gone&&(<motion.div className="intro" initial={{opacity:1}} exit={{opacity:0}} transition={{duration:.7,ease:[.22,1,.36,1]}}><div className="intro-vignette"/><div className="intro-content"><AnimatePresence mode="wait">

const WIKI_API='https://en.wikipedia.org/w/api.php';
async function fetchWikiThumb(title,size=900){
  try{
    const u=`${WIKI_API}?action=query&format=json&origin=*&prop=pageimages&piprop=thumbnail&pithumbsize=${size}&redirects=1&titles=${encodeURIComponent(title)}`;
    const r=await fetch(u); const j=await r.json(); const pages=j?.query?.pages||{};
    const page=Object.values(pages)[0]; return page?.thumbnail?.source||null;
  }catch(e){return null;}
}
function useWikiThumb(title,size=900){
  const[src,setSrc]=useState(null);
  useEffect(()=>{let live=true;setSrc(null);fetchWikiThumb(title,size).then(v=>{if(live)setSrc(v);});return()=>{live=false;};},[title,size]);
  return src;
}
function PlayerPortrait({player,src}){

}
function TrophyVisual({t}){
  const src=useWikiThumb(t.wikiTitle,700);
  return <div className="trophy-visual">{src?<img src={src} alt={t.name} loading="lazy"/>:<div className="trophy-loading">LOADING КЛУБНЫЕ ТИТУЛЫ</div>}</div>;
}
function Row({label,value}){return <div><div className="mono-label pcard-row-label">{label}</div><div className="pcard-row-value">{value||'—'}</div></div>}
function Stat({label,value}){return <div className="pcard-stat"><div className="display">{value??'—'}</div><div className="mono-label">{label}</div></div>}

function LockerRoom({onHoverSound,onClickSound}){
const[seasonId,setSeasonId]=useState('2025-26');
const[filter,setFilter]=useState('ВСЕ');
const[selectedId,setSelectedId]=useState(null);
const[hoveredId,setHoveredId]=useState(null);
const parallax=useParallax(20);
const season=useMemo(()=>SEASВКЛS.find(s=>s.id===seasonId)||SEASВКЛS[0],[seasonId]);
const filtered=useMemo(()=>filter==='ВСЕ'?season.players:season.players.filter(p=>p.position===filter),[season,filter]);
const selectedPlayer=useMemo(()=>filtered.find(p=>p.id===selectedId)||null,[filtered,selectedId]);
const idx=selectedPlayer?filtered.findIndex(p=>p.id===selectedPlayer.id):-1;
const goPrev=idx>0?()=>{setSelectedId(filtered[idx-1].id);onClickSound();}:undefined;
const goNext=idx>=0&&idx<filtered.length-1?()=>{setSelectedId(filtered[idx+1].id);onClickSound();}:undefined;
const handleSeason=(id)=>{setSeasonId(id);setSelectedId(null);onClickSound();};
const handleFilter=(f)=>{setFilter(f);setSelectedId(null);onClickSound();};
return(<div className="locker">
<div className="locker-bg" style={{transform:`translate3d(${parallax.x}px,${parallax.y}px,0) scale(1.06)`}}><div className="locker-bg-lights"/><div className="locker-bg-panels"/><div className="locker-bg-dust"/></div>
<div className="locker-head">
<div><div className="mono-label">СОСТАВ SHEET</div><h2 className="display locker-title">THE РАЗДЕВАЛКА</h2><div className="locker-head-sub mono-label">SEASВКЛ {season.label} · {season.players.length} PLAYERS</div></div>
<div className="locker-head-right mono-label"><span className="live-dot"/> ЦИФРОВОЙ АРХИВ · LIVE</div>
</div>
<SeasonSelector active={seasonId} onChange={handleSeason}/>
<PositionFilter active={filter} onChange={handleFilter}/>
<div className="locker-rail-wrap">
<div className="rail-metal"><div className="rail-line"/><div className="rail-line-back"/></div>
<div className="rail-track"><AnimatePresence mode="popLayout">{filtered.map((p,i)=>(<Shirt key={p.id} player={p} index={i} selected={selectedId===p.id} dimmed={!!selectedId&&selectedId!==p.id&&hoveredId!==p.id} kitColor={p.kit==='away'?'away':'home'} onHover={(v)=>{if(v)onHoverSound();setHoveredId(v?p.id:null);}} onSelect={()=>{onClickSound();setSelectedId(p.id);}}/>))}</AnimatePresence></div>

/* ============ ICВКЛIC ЛЕГЕНДАРНЫЕ МОМЕНТЫ ============ */
const ICВКЛIC_ЛЕГЕНДАРНЫЕ МОМЕНТЫ=[
{id:'treble-99',year:'1999',title:'ТРЕБЛ 1999',kicker:'BARCELВКЛA · 26 MAY 1999',text:'Три трофея. Одна незабываемая ночь. Manchester United оформил исторический требл в невероятной развязке.',tag:'НАСЛЕДИЕ',image:'https://upload.wikimedia.org/wikipedia/commons/thumb/3/3f/Manchester_United_1998-99.jpg/640px-Manchester_United_1998-99.jpg'},
{id:'moscow-08',year:'2008',title:'МОСКВА',kicker:'ЛУЖНИКИ · 21 МАЯ 2008',text:'A European night under the rain. United lifted the Кубок европейских чемпионов after a legendary penalty shootout.',tag:'ЕВРОПА',image:'https://upload.wikimedia.org/wikipedia/commons/thumb/4/46/Manchester_United_2008.jpg/640px-Manchester_United_2008.jpg'},
{id:'fergie-13',year:'2013',title:"FERGUSВКЛ'S LAST",kicker:'ОЛД ТРАФФОРД · 2013',text:'Последний чемпионский титул эпохи Фергюсона. Глава истории, которая определила целое поколение Manchester United.',tag:'БОСС',image:'https://upload.wikimedia.org/wikipedia/commons/thumb/2/2d/Alex_Ferguson_2011.jpg/640px-Alex_Ferguson_2011.jpg'},
{id:'cantona-96',year:'1996',title:'КОРОЛЬ ЭРИК',kicker:'УЭМБЛИ · 1996',text:'The iconic collar. The iconic number 7. Cantona returned and United reclaimed the Кубок Англии.',tag:'КОРОЛЬ',image:'https://upload.wikimedia.org/wikipedia/commons/thumb/6/63/Eric_Cantona_2011.jpg/640px-Eric_Cantona_2011.jpg'}
];
function Moments(){const[selected,setSelected]=useState(null);return(<div className="moments-page">
<div className="locker-head"><div><div className="mono-label">КРАСНЫЙ АРХИВ</div><h2 className="display locker-title">ICВКЛIC ЛЕГЕНДАРНЫЕ МОМЕНТЫ</h2><div className="mono-label locker-head-sub">ЧЕТЫРЕ НОЧИ, КОТОРЫЕ ОСТАЛИСЬ В ВЕЧНОСТИ</div></div><div className="locker-head-right mono-label"><span className="live-dot"/> РЕЖИМ АРХИВА</div></div>

<div className="moment-image" style={{backgroundImage:`linear-gradient(180deg,transparent 35%,rgba(0,0,0,.92)),url("${m.image}")`}}><div className="moment-year display">{m.year}</div><div className="moment-tag mono-label">{m.tag}</div></div>

/* ============ КРАСНЫЙ IQ ============ */
const QUIZ_QUESTIONS=[
{q:'В каком году Manchester United выиграл исторический требл?',a:['1996','1999','2008','2013'],c:1},
{q:'Какой номер стал легендарным для Эрика Кантона?',a:['7','9','10','11'],c:0},
{q:'В каком году United выиграл Кубок европейских чемпионов в Москве?',a:['1999','2003','2008','2011'],c:2},
{q:'Как называется домашний стадион Manchester United?',a:['Энфилд','Этихад','Олд Траффорд','Уэмбли'],c:2},
{q:'Кто тренировал United во время требла 1999 года?',a:['Жозе Моуринью','Алекс Фергюсон','Дэвид Мойес','Луи ван Гал'],c:1},
{q:'Как называется знаменитая академия, связанная с поколением 1992 года?',a:['Class of 92','Red Academy','United Youth','Busby School'],c:0}
];
function RedIQ(){const[idx,setIdx]=useState(0);const[score,setScore]=useState(0);const[chosen,setChosen]=useState(null);const[done,setDone]=useState(false);const question=QUIZ_QUESTIONS[idx];
const answer=(i)=>{if(chosen!==null)return;setChosen(i);if(i===question.c)setScore(v=>v+1);};
const next=()=>{if(idx<QUIZ_QUESTIONS.length-1){setIdx(v=>v+1);setChosen(null);}else setDone(true);};
const restart=()=>{setIdx(0);setScore(0);setChosen(null);setDone(false);};
return <div className="rediq"><div className="rediq-glow"/><div className="rediq-inner">
<div className="locker-head"><div><div className="mono-label">RED DEVILS · IQ TEST</div><h2 className="display locker-title">КРАСНЫЙ IQ</h2><div className="mono-label locker-head-sub">ПРОВЕРЬ, НАСКОЛЬКО ХОРОШО ТЫ ЗНАЕШЬ UNITED</div></div><div className="rediq-score mono-label">{done?'РЕЗУЛЬТАТ':`ВОПРОС ${idx+1} / ${QUIZ_QUESTIONS.length}`}</div></div>
{done?<motion.div className="rediq-result" initial={{opacity:0,y:25}} animate={{opacity:1,y:0}}><div className="rediq-ring"><span className="display">{score}/{QUIZ_QUESTIONS.length}</span></div><div className="mono-label">ТВОЙ УРОВЕНЬ</div><h3 className="display">{score===QUIZ_QUESTIONS.length?'ЛЕГЕНДА ОЛД ТРАФФОРДА':score>=4?'НАСТОЯЩИЙ RED DEVIL':score>=2?'КРЕПКИЙ ФАНАТ':'ЕЩЁ ОДИН МАТЧ И ТЫ В ФОРМЕ'}</h3><p>{score===QUIZ_QUESTIONS.length?'Безупречно. Тебя можно выпускать на поле против истории.':score>=4?'Очень достойно. Красная кровь есть.':'Ничего страшного — пересматриваем легендарные моменты и пробуем ещё раз.'}</p><button className="rediq-btn display" onClick={restart}>ПРОЙТИ ЕЩЁ РАЗ</button></motion.div>:
<motion.div className="rediq-card" key={idx} initial={{opacity:0,x:30}} animate={{opacity:1,x:0}}><div className="rediq-number display">0{idx+1}</div><div className="rediq-question display">{question.q}</div><div className="rediq-options">{question.a.map((a,i)=><button key={a} className={`rediq-option ${chosen!==null?(i===question.c?'correct':i===chosen?'wrong':'muted'):''}`} onClick={()=>answer(i)}><span>{String.fromCharCode(65+i)}</span>{a}</button>)}</div>{chosen!==null&&<motion.div className="rediq-next" initial={{opacity:0}} animate={{opacity:1}}><div className="mono-label">{chosen===question.c?'✓ ПРАВИЛЬНО':'✕ НЕПРАВИЛЬНО'}</div><button className="rediq-btn display" onClick={next}>{idx===QUIZ_QUESTIONS.length-1?'РЕЗУЛЬТАТ':'СЛЕДУЮЩИЙ ВОПРОС'} →</button></motion.div>}</motion.div>}
</div></div>;
}

{section==='trophies'&&<TrophyRoom/>}
{section==='history'&&<Timeline/>}
{section==='moments'&&<Moments/>}
<Footer/>
</div>);}

createRoot(document.getElementById('root')).render(<React.StrictMode><App/></React.StrictMode>);

window.__MU_BOOT_OK__=true;

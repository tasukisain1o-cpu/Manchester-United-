const timeline=[['1878','Newton Heath LYR','Клуб основан рабочими железнодорожного депо.'],['1902','Manchester United','Клуб получает имя Manchester United.'],['1958','Мюнхен','Трагедия Busby Babes. Клуб переживает один из самых тяжёлых дней своей истории.'],['1968','Кубок чемпионов','Чарльтон, Бест и компания выигрывают первый Кубок чемпионов для Англии.'],['1990-е','Эпоха Фергюсона','Начинается доминирование в Англии. Появляется Class of ’92.'],['1999','ТРЕБЛ','АПЛ + Кубок Англии + Лига чемпионов. Камп Ноу и невероятный финал.'],['2008','МОСКВА','Лига чемпионов. Роналду забивает, Ван дер Сар спасает серию пенальти.'],['2013','Последний сезон Фергюсона','26 лет, 38 трофеев и завершение великой эпохи.'],['2024','Кубок Англии','Победа над Manchester City на Wembley.']];
const moments=[['1999','ТРЕБЛ','Последние минуты на Камп Ноу. Два гола за несколько мгновений превращают поражение в легенду.'],['2008','МОСКВА','Первый большой европейский финал для поколения Роналду. Ван дер Сар становится героем серии пенальти.'],['1968','ПЕРВАЯ ЕВРОПА','United становится первым английским клубом, выигравшим Кубок чемпионов.'],['1996','КОРОЛЬ ЭРИК','Финал Кубка Англии и знаменитый гол Кантоне — один из символов эпохи.'],['1992','CLASS OF ’92','Поколение Гиггза, Бекхэма, Скоулза, Невиллов и Батта меняет клуб.'],['2013','THE END OF AN ERA','Фергюсон уходит после чемпионского сезона, оставляя огромную футбольную эпоху.']];
const quiz=[['Кто забил победный гол Manchester United в финале ЛЧ 1968?',['Бобби Чарльтон','Джордж Бест','Денис Лоу','Брайан Кидд'],0],['В каком году United выиграл требл?',['1996','1998','1999','2000'],2],['Кто был капитаном команды в финале ЛЧ 2008?',['Рио Фердинанд','Райан Гиггз','Неманья Видич','Эдвин ван дер Сар'],1],['Сколько титулов АПЛ выиграл United при Фергюсоне?',['10','11','12','13'],3],['Кто стал лучшим бомбардиром в истории клуба, превысив 250 голов?',['Руни','Роналду','Бест','Чарльтон'],0],['Как назывался стадион до переименования в Manchester United?',['Old Trafford','Bank Street','Maine Road','Highbury'],1]];
const state={section:'locker',season:'2025-26',filter:'ВСЕ',sound:false,players:[],playerIndex:0,quizIndex:0,quizScore:0,quizAnswered:false};
const navItems=[['locker','РАЗДЕВАЛКА'],['match','МАТЧДЕЙ'],['history','ИСТОРИЯ'],['moments','МОМЕНТЫ'],['trophies','ТРОФЕИ'],['legends','ЛЕГЕНДЫ'],['quiz','КРАСНЫЙ IQ']];
const app=document.getElementById('app'),nav=document.getElementById('nav'),mobile=document.getElementById('mobileMenu');
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));}
function renderNav(){nav.innerHTML=navItems.map(x=>`<button class="nav-link ${state.section===x[0]?'active':''}" data-nav="${x[0]}">${x[1]}</button>`).join('');mobile.innerHTML=navItems.map(x=>`<button data-nav="${x[0]}">${x[1]}</button>`).join('');document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>{go(b.dataset.nav);mobile.classList.remove('open')});}
function go(s){state.section=s;renderNav();render();window.scrollTo({top:0,behavior:'smooth'});}
function sectionHead(k,t,sub=''){return `<div class="section-head"><div><div class="mono kicker">${k}</div><h1 class="display title">${t}</h1>${sub?`<div class="mono" style="margin-top:9px">${sub}</div>`:''}</div></div>`}
function shirt(p,i){return `<button class="shirt-card" data-player="${esc(p.id)}"><div class="hanger"><div class="hook"></div></div><div class="shirt ${p.kit==='away'?'away':''}"><div class="shirt-text"><div class="display num">${p.n}</div><div class="display surname">${esc(p.name)}</div></div></div><div class="mono shirt-meta">${esc(p.pos)} · #${p.n}</div></button>`}
function locker(){let ps=seasons[state.season]||[];if(state.filter!=='ВСЕ')ps=ps.filter(p=>p.pos===state.filter);state.players=ps;return `<section class="section"><div class="hero-bg"></div><div class="hero-grid"></div>${sectionHead('ЦИФРОВАЯ РАЗДЕВАЛКА','THE LOCKER ROOM',`СЕЗОН ${state.season} · ${ps.length} ИГРОКОВ`)}<div class="filters">${Object.keys(seasons).map(y=>`<button class="chip ${state.season===y?'active':''}" data-season="${y}">${y}</button>`).join('')}</div><div class="filters">${['ВСЕ','ВР','ЗАЩ','ПЗ','НАП'].map(f=>`<button class="chip ${state.filter===f?'active':''}" data-filter="${f}">${f}</button>`).join('')}</div><div class="rail">${ps.map(shirt).join('')}</div><div class="mono" style="color:var(--dim)">EST. 1878 · MANCHESTER · THEATRE OF DREAMS</div></section>`}
function match(){return `<section class="section match">${sectionHead('МАТЧДЕЙ','NEXT MATCH','ВИТРИНА МАТЧА · СОСТАВ · АТМОСФЕРА')}<div class="match-card"><div class="match-top"><div class="mono">ПРЕМЬЕР-ЛИГА · 18:30</div><div class="mono red">ОЛД ТРАФФОРД</div></div><div class="score"><div class="team"><div class="team-badge">MU</div><div class="team-name display">MANCHESTER UNITED</div></div><div class="scoreline display">— : —</div><div class="team"><div class="team-badge" style="background:linear-gradient(145deg,#444,#171717)">OPP</div><div class="team-name display">СОПЕРНИК</div></div></div><div class="lineup"><div class="mono">ПРЕДПОЛАГАЕМЫЙ СОСТАВ</div><div class="lineup-grid">${['ONANA','DALOT','MARTÍNEZ','BRUNO','CASEMIRO','MOUNT','DIALLO','CUNHA'].map((n,i)=>`<div class="lineup-player"><div class="lineup-num display">${i+1}</div><div class="display">${n}</div></div>`).join('')}</div></div></div></section>`}
function history(){return `<section class="section"><div class="hero-bg"></div>${sectionHead('ЛЕТОПИСЬ КЛУБА','1878 → СЕГОДНЯ','ГЛАВНЫЕ ТОЧКИ ИСТОРИИ MANCHESTER UNITED')}<div class="timeline">${timeline.map(e=>`<article class="event"><div class="display event-year">${e[0]}</div><div class="display event-title">${e[1]}</div><div class="event-text">${e[2]}</div></article>`).join('')}</div></section>`}
function momentsView(){return `<section class="section"><div class="hero-bg"></div>${sectionHead('LEGEND MOMENTS','МГНОВЕНИЯ','СОБЫТИЯ, КОТОРЫЕ СТАЛИ ЧАСТЬЮ ДНК UNITED')}<div class="moments">${moments.map((m,i)=>`<article class="moment"><div class="display moment-year">${m[0]}</div><h3 class="display">${m[1]}</h3><p>${m[2]}</p><button data-moment="${i}">ОТКРЫТЬ МОМЕНТ →</button></article>`).join('')}</div></section>`}
function cupSvg(){return `<svg viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M39 22h42l-5 48c-2 17-12 25-16 25s-14-8-16-25l-5-48Z" fill="#d8d8d8"/><path d="M39 28H22c0 22 7 32 20 32M81 28h17c0 22-7 32-20 32" stroke="#aaa" stroke-width="7" stroke-linecap="round"/><path d="M60 95v15M43 112h34" stroke="#aaa" stroke-width="7" stroke-linecap="round"/><path d="M44 22h32" stroke="#fff" stroke-width="5"/></svg>`}
function trophiesView(){return `<section class="section"><div class="hero-bg"></div>${sectionHead('ЗАЛ ТРОФЕЕВ','SILVERWARE','ТИТУЛЫ И ПАМЯТНЫЕ СЕЗОНЫ')}<div class="trophies">${trophies.map(t=>`<article class="trophy"><div class="cup">${cupSvg()}</div><div class="display trophy-count">${t[1]}</div><div class="display trophy-name">${t[0]}</div><div class="mono" style="margin-top:8px">ПОСЛЕДНИЙ · ${t[2]}</div><div class="trophy-desc">${t[3]}</div></article>`).join('')}</div></section>`}
function legendsView(){return `<section class="section"><div class="hero-bg"></div>${sectionHead('HALL OF FAME','ЛЕГЕНДЫ','ИМЕНА, КОТОРЫЕ НЕ УХОДЯТ')}<div class="rail">${legends.map(shirt).join('')}</div></section>`}
function quizView(){let q=quiz[state.quizIndex];if(state.quizIndex>=quiz.length)return `<section class="section"><div class="hero-bg"></div>${sectionHead('RED DEVIL IQ','РЕЗУЛЬТАТ','ТЕПЕРЬ ТЫ МОЖЕШЬ ПОПРОБОВАТЬ ЕЩЁ РАЗ')}<div class="quiz-wrap"><div class="quiz-result"><div class="mono">ТВОЙ РЕЗУЛЬТАТ</div><div class="display result-score">${state.quizScore}/${quiz.length}</div><h2 class="display">${state.quizScore===quiz.length?'ЛЕГЕНДА ОЛД ТРАФФОРД':state.quizScore>=4?'НАСТОЯЩИЙ RED DEVIL':state.quizScore>=2?'КРЕПКИЙ ФАНАТ':'ЕСТЬ КУДА РАСТИ 😈'}</h2><button class="chip active" id="quizRestart" style="margin-top:20px">ПРОЙТИ ЕЩЁ РАЗ</button></div></div></section>`;return `<section class="section"><div class="hero-bg"></div>${sectionHead('RED DEVIL IQ',`ВОПРОС ${state.quizIndex+1} / ${quiz.length}`,'ПРОВЕРЬ, НАСКОЛЬКО ТЫ ЗНАЕШЬ UNITED')}<div class="quiz-wrap"><div class="quiz-q display">${q[0]}</div><div class="answers">${q[1].map((a,i)=>`<button class="answer ${state.quizAnswered?(i===q[2]?'correct':''):''}" data-answer="${i}" ${state.quizAnswered?'disabled':''}>${a}</button>`).join('')}</div>${state.quizAnswered?`<div class="mono" style="margin-top:20px;color:${state.quizScore===state.quizIndex+1?'#5fd68a':'var(--muted)'}">${q[2]===state.lastAnswer?'ВЕРНО.':'ПРАВИЛЬНЫЙ ОТВЕТ: '+q[1][q[2]]}</div><button class="chip active" id="quizNext" style="margin-top:15px">${state.quizIndex===quiz.length-1?'ПОКАЗАТЬ РЕЗУЛЬТАТ':'СЛЕДУЮЩИЙ ВОПРОС →'}</button>`:''}</div></section>`}
function render(){let html=state.section==='locker'?locker():state.section==='match'?match():state.section==='history'?history():state.section==='moments'?momentsView():state.section==='trophies'?trophiesView():state.section==='legends'?legendsView():quizView();app.innerHTML=html;bind();}
function bind(){document.querySelectorAll('[data-season]').forEach(b=>b.onclick=()=>{state.season=b.dataset.season;state.filter='ВСЕ';render()});document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{state.filter=b.dataset.filter;render()});document.querySelectorAll('[data-player]').forEach(b=>b.onclick=()=>openPlayer(b.dataset.player));document.querySelectorAll('[data-moment]').forEach(b=>b.onclick=()=>openMoment(+b.dataset.moment));if(document.getElementById('quizRestart'))document.getElementById('quizRestart').onclick=()=>{state.quizIndex=0;state.quizScore=0;state.quizAnswered=false;render()};document.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>answer(+b.dataset.answer));if(document.getElementById('quizNext'))document.getElementById('quizNext').onclick=()=>{state.quizIndex++;state.quizAnswered=false;render()}}
function allPlayers(){return [...Object.values(seasons).flat(),...legends]}
function openPlayer(id){let p=allPlayers().find(x=>x.id===id);if(!p)return;state.players=state.section==='legends'?legends:(seasons[state.season]||[]);state.playerIndex=state.players.findIndex(x=>x.id===id);if(state.playerIndex<0)state.playerIndex=0;showPlayer(state.players[state.playerIndex],state.section==='legends'?'ЛЕГЕНДЫ':state.season)}
function showPlayer(p,label){document.getElementById('pSeason').textContent='MANCHESTER UNITED · '+label;document.getElementById('pNum').textContent=p.n;document.getElementById('pName').textContent=p.name;document.getElementById('pFull').textContent=p.full;document.getElementById('pGrid').innerHTML=[['КЛУБ','Manchester United'],['ПОЗИЦИЯ',p.pos],['ДАТА РОЖДЕНИЯ',p.birth],['СТРАНА',p.nat],['НОМЕР','#'+p.n],['ТРОФЕИ',p.trophies]].map(x=>`<div><div class="mono">${x[0]}</div><div class="info-value">${esc(x[1])}</div></div>`).join('');document.getElementById('pStats').innerHTML=[['МАТЧИ',p.apps],['ГОЛЫ',p.goals],['ГОЛЕВЫЕ',p.assists]].map(x=>`<div class="stat"><div class="mono">${x[0]}</div><b class="display">${x[1]}</b></div>`).join('');const img=document.getElementById('playerImg'),ph=document.getElementById('photoPlaceholder');img.style.display='none';ph.style.display='block';const photoUrl=p.photo?'https://commons.wikimedia.org/wiki/Special:FilePath/'+encodeURIComponent(p.photo)+'?width=900':'https://en.wikipedia.org/api/rest_v1/page/summary/'+encodeURIComponent(p.full);if(p.photo){img.src=photoUrl}else{fetch(photoUrl).then(r=>r.json()).then(d=>{if(d.thumbnail&&d.thumbnail.source)img.src=d.thumbnail.source}).catch(()=>{})}img.onload=()=>{img.style.display='block';ph.style.display='none'};img.onerror=()=>{img.style.display='none';ph.style.display='block'};document.getElementById('playerModal').classList.add('open')}
function openMoment(i){const m=moments[i];document.getElementById('mYear').textContent=m[0];document.getElementById('mTitle').textContent=m[1];document.getElementById('mText').textContent=m[2];document.getElementById('momentOverlay').classList.add('open')}
function answer(i){if(state.quizAnswered)return;state.lastAnswer=i;state.quizAnswered=true;if(i===quiz[state.quizIndex][2])state.quizScore++;render()}
function toast(t){const el=document.getElementById('toast');el.textContent=t;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),1800)}
document.getElementById('closePlayer').onclick=()=>document.getElementById('playerModal').classList.remove('open');document.getElementById('playerModal').onclick=e=>{if(e.target.id==='playerModal')e.currentTarget.classList.remove('open')};document.getElementById('closeMoment').onclick=()=>document.getElementById('momentOverlay').classList.remove('open');document.getElementById('momentOverlay').onclick=e=>{if(e.target.id==='momentOverlay')e.currentTarget.classList.remove('open')};
document.getElementById('prevPlayer').onclick=()=>{if(state.playerIndex>0){state.playerIndex--;showPlayer(state.players[state.playerIndex],state.section==='legends'?'ЛЕГЕНДЫ':state.season)}};document.getElementById('nextPlayer').onclick=()=>{if(state.playerIndex<state.players.length-1){state.playerIndex++;showPlayer(state.players[state.playerIndex],state.section==='legends'?'ЛЕГЕНДЫ':state.season)}};
document.getElementById('burger').onclick=()=>mobile.classList.toggle('open');let audioCtx=null;document.getElementById('sound').onclick=()=>{state.sound=!state.sound;document.getElementById('sound').textContent='ЗВУК · '+(state.sound?'ВКЛ':'ВЫКЛ');if(state.sound){try{audioCtx=new AudioContext();const o=audioCtx.createOscillator();const g=audioCtx.createGain();o.frequency.value=220;g.gain.value=.02;o.connect(g);g.connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+.07)}catch(e){}}};
renderNav();render();setTimeout(()=>document.getElementById('intro').classList.add('hide'),2100);setTimeout(()=>document.getElementById('intro').remove(),2900);
</script>
</body>
</html>
